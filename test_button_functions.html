<!DOCTYPE html>
<html>
<head>
    <title>Button Function Test</title>
</head>
<body>
    <h1>Testing Dashboard Functions</h1>
    <div id="results"></div>
    
    <script>
        // Load the dashboard HTML to test functions
        async function testFunctions() {
            const results = document.getElementById('results');
            const tests = [];
            
            try {
                // Fetch the dashboard HTML
                const response = await fetch('http://localhost:8000/');
                const html = await response.text();
                
                // Check if functions are defined
                const functionChecks = [
                    { name: 'createSession', pattern: /function createSession/ },
                    { name: 'enrollStudent', pattern: /function enrollStudent/ },
                    { name: 'createCourse', pattern: /function createCourse/ },
                    { name: 'loadSessions', pattern: /function loadSessions/ },
                    { name: 'loadStudents', pattern: /function loadStudents/ },
                    { name: 'loadCourses', pattern: /function loadCourses/ },
                    { name: 'startSession', pattern: /function startSession/ },
                    { name: 'stopSession', pattern: /function stopSession/ },
                    { name: 'showSuccess', pattern: /function showSuccess/ },
                    { name: 'showError', pattern: /function showError/ },
                    { name: 'API_BASE_URL', pattern: /const API_BASE_URL/ }
                ];
                
                functionChecks.forEach(check => {
                    const found = check.pattern.test(html);
                    tests.push({
                        name: check.name,
                        status: found ? '✅' : '❌',
                        found: found
                    });
                });
                
                // Check button onclick handlers
                const buttonChecks = [
                    { name: 'Create Session button', pattern: /onclick="createSession\(event\)"/ },
                    { name: 'Enroll Student button', pattern: /onclick="enrollStudent\(event\)"/ },
                    { name: 'Create Course button', pattern: /onclick="createCourse\(event\)"/ },
                    { name: 'Load Sessions button', pattern: /onclick="loadSessions\(\)"/ },
                    { name: 'Start Session button', pattern: /onclick="startSession\(\)"/ },
                    { name: 'Stop Session button', pattern: /onclick="stopSession\(\)"/ }
                ];
                
                buttonChecks.forEach(check => {
                    const found = check.pattern.test(html);
                    tests.push({
                        name: check.name,
                        status: found ? '✅' : '❌',
                        found: found
                    });
                });
                
                // Display results
                let htmlResults = '<h2>Function Tests</h2><ul>';
                tests.forEach(test => {
                    htmlResults += `<li>${test.status} ${test.name}</li>`;
                });
                htmlResults += '</ul>';
                
                const passed = tests.filter(t => t.found).length;
                const total = tests.length;
                htmlResults += `<h3>Summary: ${passed}/${total} tests passed</h3>`;
                
                results.innerHTML = htmlResults;
                
            } catch (error) {
                results.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // Run tests when page loads
        window.onload = testFunctions;
    </script>
</body>
</html>
