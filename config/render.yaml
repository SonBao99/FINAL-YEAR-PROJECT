services:
  - type: web
    name: attendance-system
    env: python
    buildCommand: pip install -r config/requirements.txt
    startCommand: uvicorn src.api.attendance_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false  # Set this in Render dashboard
      - key: MONGODB_DATABASE
        value: attendance_db
      - key: PORT
        value: 8000
    healthCheckPath: /health

